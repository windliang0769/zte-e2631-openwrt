name: Build experimental E2631 firmware
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2631-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      E2631_TREE: ${{ github.workspace }}/../openwrt
      E2631_OUT: ${{ github.workspace }}/../out
      E2631_VERSION: OpenWrt v1.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        run: |
          set -euo pipefail
          # ubuntu-24.04 runners point apt at the Azure-internal mirror
          # azure.archive.ubuntu.com via mirror+file:/etc/apt/apt-mirrors.txt.
          # Runs #21 and #22 both died here: 62x "Temporary failure resolving
          # 'azure.archive.ubuntu.com'" (apt exit 100), while
          # packages.microsoft.com and github.com resolved fine. That is a
          # runner-side DNS failure for the Azure-internal name only, NOT a
          # source or firmware problem. Rewrite apt to public Ubuntu hosts and
          # retry, so a flaky Azure DNS can never block the build again.
          echo "::group::apt DNS preflight"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if timeout 8 getent ahosts "$h" >/dev/null 2>&1; then
              echo "  $h -> resolvable"
            else
              echo "  $h -> UNRESOLVABLE"
            fi
          done
          echo "::endgroup::"
          # If even the public Ubuntu hosts do not resolve, keep the runner's
          # own resolver as fallback but prepend a public one first.
          if ! timeout 8 getent ahosts archive.ubuntu.com >/dev/null 2>&1; then
            echo "prepending a public resolver (runner DNS cannot resolve Ubuntu mirrors)"
            sudo sh -c '{ printf "%s\n" "nameserver 8.8.8.8"; cat /etc/resolv.conf; } > /etc/resolv.conf.new && mv /etc/resolv.conf.new /etc/resolv.conf'
          fi
          # Drop the unreachable Azure-internal host and stop the deb822
          # sources from using the mirror+file indirection altogether.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt || true
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' "$f"
          done
          echo "--- apt sources after rewrite ---"
          cat /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/sources.list.d/ubuntu.sources || true
          APT_OPTS="-o Acquire::Retries=10 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          ok=0
          for attempt in 1 2 3; do
            echo "apt-get update attempt $attempt"
            if sudo apt-get $APT_OPTS update; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get update failed after 3 attempts"; exit 1; }
          sudo apt-get $APT_OPTS install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl busybox libelf-dev xsltproc
      - name: Check source before building
        run: make check
      - name: Bootstrap pinned OpenWrt base
        run: make bootstrap
      - name: Check board references against the base tree
        run: make check
      - name: Build firmware (no vendor pack - RAX1800Z flashes from U-Boot)
        run: bash scripts/build.sh --no-pack
      - name: Prepare experimental release
        id: release
        run: |
          set -euo pipefail
          mkdir -p release
          find "$E2631_TREE/bin/targets" -type f -name '*rax1800*' \
            -exec cp {} release/ \;
          ls -l "$E2631_TREE/bin/targets/sanechips/generic/" >> release/IMAGE-LIST.txt 2>/dev/null || true
          find "$E2631_OUT" -maxdepth 2 -name 'config-6.18' -exec cp {} release/rax1800z-kernel-config.txt \;
          {
            echo "Kit commit: $GITHUB_SHA"
            echo "Base commit: $(git -C "$E2631_TREE" rev-parse HEAD)"
            echo "Packages feed: $(git -C "$E2631_TREE/feeds/packages" rev-parse HEAD)"
            echo "LuCI feed: $(git -C "$E2631_TREE/feeds/luci" rev-parse HEAD)"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Hardware tested: NO"
          } > release/SOURCE-INFO.txt
          (cd release && sha256sum * > SHA256SUMS)
          echo "tag=rax1800z-exp-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Publish only after all build and artifact gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          RAX1800Z 实验固件（CMCC RAX1800-Z / ZX279128R，仅串口试机用）。

          通过本次源码检查、完整编译与产物校验；**尚未真机验证，不是稳定版**。
          已知问题：网口与 WiFi 驱动均未真机验证；initramfs 镜像仅供 U-Boot TFTP 试跑；
          首次进入应立即设置 root 密码（首启为开放设置网络）。
          下载 `.bin` 前核对设备型号、闪存批次及恢复途径，再按 SHA256SUMS 校验。
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "E2631 experimental ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Stage build logs for archiving
        if: always()
        run: |
          mkdir -p build-logs
          if [ -d "$E2631_OUT" ]; then
            find "$E2631_OUT" -maxdepth 2 -type f -name world.log -exec cp '{}' build-logs/ \;
          fi
      - name: Retain build logs and release files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2631-build-${{ github.run_id }}
          path: |
            build-logs/
            release/
          if-no-files-found: ignore
          retention-days: 14
